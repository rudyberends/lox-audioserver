    <script>
      'use strict';
      const urlParams = new URLSearchParams(window.location.search);
      const redirectUrl = decodeURIComponent(urlParams.get('state') || '');
      const validOrigin = document.referrer && document.referrer.includes('spotify.com');
      const validDest =
        redirectUrl.includes(':') &&
        redirectUrl.includes('/callback/') &&
        !redirectUrl.includes('hassio_ingress');
      const code = encodeURIComponent(urlParams.get('code') || '');
      const finalUrl = redirectUrl ? `${redirectUrl}?code=${code}` : '';

      if (finalUrl && validOrigin && validDest) {
        window.location.replace(finalUrl);
      } else if (finalUrl) {
        // Fallback: open the local callback in a new tab/link
        window.location.href = finalUrl;
      }
    </script>
