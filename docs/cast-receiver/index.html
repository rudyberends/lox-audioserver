<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sendspin Cast Receiver</title>
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: "Inter", "Roboto", system-ui, -apple-system, sans-serif;
        background: #0b0c10;
        color: #e6e7eb;
      }
      #status {
        position: fixed;
        bottom: 12px;
        left: 12px;
        font-size: 14px;
        opacity: 0.8;
      }
      #debug {
        position: fixed;
        bottom: 12px;
        right: 12px;
        font-size: 12px;
        opacity: 0.5;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <cast-media-player></cast-media-player>
    <div id="status">Waiting for sender…</div>
    <div id="debug"></div>
    <script type="module">
      import { SendspinPlayer } from 'https://esm.sh/@music-assistant/sendspin-js@0.1.0';

      (() => {
        'use strict';

        const CAST_NS = 'urn:x-cast:sendspin';
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();
        const statusEl = document.getElementById('status');
        const debugEl = document.getElementById('debug');

        const setStatus = (text) => (statusEl.textContent = text);
        const setDebug = (text) => (debugEl.textContent = text);

        const buildMediaInfo = (meta) => {
          const mediaInfo = new cast.framework.messages.MediaInformation();
          const metadata = new cast.framework.messages.MusicTrackMediaMetadata();
          metadata.title = meta?.title || 'Sendspin';
          metadata.artist = meta?.artist || '';
          metadata.albumName = meta?.album || '';
          if (meta?.artwork_url) {
            metadata.images = [{ url: meta.artwork_url }];
          }
          mediaInfo.metadata = metadata;
          mediaInfo.contentId = 'sendspin://live';
          mediaInfo.contentType = 'audio/raw';
          mediaInfo.streamType = cast.framework.messages.StreamType.LIVE;
          return mediaInfo;
        };

        const pushMediaStatus = (state, meta) => {
          if (!playerManager) return;
          const info = buildMediaInfo(meta);
          playerManager.setMediaInformation(info);
          playerManager.setPlayerState(state);
          playerManager.broadcastStatus(true);
        };

        const castCtx = context;
        const getHWVolume = () => {
          const sys = castCtx.getSystemVolume?.();
          return sys
            ? { volume: Math.round((sys.level || 0) * 100), muted: !!sys.muted }
            : { volume: 100, muted: false };
        };
        const setHWVolume = (vol, muted) => {
          try {
            if (typeof vol === 'number') castCtx.setSystemVolumeLevel?.(Math.max(0, Math.min(1, vol / 100)));
            if (typeof muted === 'boolean') castCtx.setSystemVolumeMuted?.(muted);
          } catch (err) {
            console.warn('HW volume failed', err);
          }
        };

        let providedPlayerId = null;
        let providedPlayerName = null;
        let providedSyncDelay = 0;
        let providedCodecs = null;
        let player = null;

        const getPlayerId = () => {
          if (providedPlayerId) {
            localStorage.setItem('sendspin_player_id', providedPlayerId);
            return providedPlayerId;
          }
          const params = new URLSearchParams(window.location.search);
          const q = params.get('player_id');
          if (q) {
            localStorage.setItem('sendspin_player_id', q);
            return q;
          }
          const stored = localStorage.getItem('sendspin_player_id');
          if (stored) return stored;
          const gen = `cast-${Math.random().toString(36).slice(2, 10)}`;
          localStorage.setItem('sendspin_player_id', gen);
          return gen;
        };

        const sendStatusToSender = (status) => {
          castCtx.sendCustomMessage(CAST_NS, undefined, status);
        };

        const updateDebug = (p) => {
          const sync = p.timeSyncInfo;
          const info = p.syncInfo;
          setDebug(
            `${sync.synced ? `offset ${sync.offset}ms ±${sync.error}ms` : 'sync: waiting'} · drift ${info.clockDriftPercent.toFixed(2)}% · error ${info.syncErrorMs.toFixed(1)}ms · resyncs ${info.resyncCount}`,
          );
        };

        const sendPlayerStatus = (p) => {
          const hw = getHWVolume();
          const sync = p.timeSyncInfo;
          const info = p.syncInfo;
          sendStatusToSender({
            state: p.isPlaying ? 'playing' : 'stopped',
            volume: hw.volume,
            muted: hw.muted,
            sync: { synced: sync.synced, offset: sync.offset, error: sync.error },
            syncInfo: info,
          });
        };

        const connectToServer = async (baseUrl) => {
          const playerId = getPlayerId();
          const name = providedPlayerName || 'Sendspin Cast Receiver';
          setStatus('Connecting…');
          sendStatusToSender({ state: 'connecting' });
          player = new SendspinPlayer({
            playerId,
            baseUrl,
            clientName: name,
            syncDelay: providedSyncDelay,
            bufferCapacity: 1024 * 1024 * 2,
            codecs: providedCodecs ?? ['pcm'],
            useHardwareVolume: true,
            onVolumeCommand: setHWVolume,
            getExternalVolume: getHWVolume,
            useOutputLatencyCompensation: true,
            onStateChange: (state) => {
              setStatus(state.isPlaying ? 'Playing' : 'Stopped');
              sendPlayerStatus(player);
              pushMediaStatus(
                state.isPlaying
                  ? cast.framework.messages.PlayerState.PLAYING
                  : cast.framework.messages.PlayerState.PAUSED,
                player.metadata ?? null,
              );
              updateDebug(player);
            },
          });
          try {
            await player.connect();
            setStatus('Ready');
            sendStatusToSender({ state: 'connected' });
            // Announce media status to Cast runtime immediately
            pushMediaStatus(cast.framework.messages.PlayerState.PAUSED, player.metadata ?? null);
            setInterval(() => {
              updateDebug(player);
              sendPlayerStatus(player);
              pushMediaStatus(
                player.isPlaying
                  ? cast.framework.messages.PlayerState.PLAYING
                  : cast.framework.messages.PlayerState.PAUSED,
                player.metadata ?? null,
              );
            }, 1000);
          } catch (err) {
            console.error('Sendspin connect failed', err);
            setStatus('Error');
            sendStatusToSender({ state: 'error', message: 'connect failed' });
          }
          window.player = player;
        };

        // Cast listeners
        castCtx.addEventListener(cast.framework.system.EventType.SYSTEM_VOLUME_CHANGED, () => {
          if (player) sendPlayerStatus(player);
        });

        // Custom message handler from sender
        castCtx.addCustomMessageListener(CAST_NS, (event) => {
          const data = event?.data;
          if (!data?.serverUrl) return;
          if (Array.isArray(data.codecs)) providedCodecs = data.codecs;
          if (data.playerId) providedPlayerId = data.playerId;
          if (data.playerName) providedPlayerName = data.playerName;
          if (typeof data.syncDelay === 'number') providedSyncDelay = data.syncDelay;
          connectToServer(data.serverUrl);
        });

        const options = new cast.framework.CastReceiverOptions();
        options.customNamespaces = {
          [CAST_NS]: cast.framework.system.MessageType.JSON,
        };
        options.disableIdleTimeout = true;
        options.maxInactivity = 3600;
        castCtx.start(options);
        setStatus('Ready');
        pushMediaStatus(cast.framework.messages.PlayerState.IDLE, null);
        // Periodically reassure the Cast runtime so it never reports "No media status".
        setInterval(() => pushMediaStatus(cast.framework.messages.PlayerState.IDLE, null), 15_000);
      })();
    </script>
  </body>
</html>
