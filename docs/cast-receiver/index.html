<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sendspin Cast Receiver</title>
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: "Inter", "Roboto", system-ui, -apple-system, sans-serif;
        background: #0b0c10;
        color: #e6e7eb;
      }
      #status {
        position: fixed;
        bottom: 12px;
        left: 12px;
        font-size: 14px;
        opacity: 0.8;
      }
      #debug {
        position: fixed;
        bottom: 12px;
        right: 12px;
        font-size: 12px;
        opacity: 0.5;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <cast-media-player></cast-media-player>
    <div id="status">Waiting for sender…</div>
    <div id="debug"></div>
    <script>
      (() => {
        'use strict';

        const CAST_NS = 'urn:x-cast:sendspin';
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();

        const statusEl = document.getElementById('status');
        const debugEl = document.getElementById('debug');

        const setStatus = (text) => {
          if (statusEl) statusEl.textContent = text;
        };
        const setDebug = (text) => {
          if (debugEl) debugEl.textContent = text;
        };

        let ws = null;
        let currentServer = null;
        let playerId = null;
        let playerName = 'Sendspin Cast';
        let audioCtx = null;
        let streamFormat = null;
        let playHead = 0;
        let lastMetadata = null;

        const getStoredPlayerId = () => {
          const params = new URLSearchParams(window.location.search);
          const paramId = params.get('player_id');
          if (paramId) {
            localStorage.setItem('sendspin_player_id', paramId);
            return paramId;
          }
          const stored = localStorage.getItem('sendspin_player_id');
          if (stored) return stored;
          const generated = `cast-${Math.random().toString(36).slice(2, 10)}`;
          localStorage.setItem('sendspin_player_id', generated);
          return generated;
        };

        const getHardwareVolume = () => {
          const systemVolume = context.getSystemVolume?.();
          if (!systemVolume) return { volume: 100, muted: false };
          return {
            volume: Math.round((systemVolume.level || 0) * 100),
            muted: Boolean(systemVolume.muted),
          };
        };

        const setHardwareVolume = (volume, muted) => {
          try {
            if (typeof volume === 'number') {
              context.setSystemVolumeLevel?.(Math.max(0, Math.min(1, volume / 100)));
            }
            if (typeof muted === 'boolean') {
              context.setSystemVolumeMuted?.(muted);
            }
          } catch (err) {
            console.warn('Sendspin: setting HW volume failed', err);
          }
        };

        const resetAudio = () => {
          playHead = 0;
          streamFormat = null;
        };

        const ensureAudioContext = () => {
          if (!audioCtx) {
            audioCtx = new AudioContext();
          }
          return audioCtx;
        };

        const buildMediaInfo = (meta) => {
          if (!playerManager || !meta) return null;
          const mediaInfo = new cast.framework.messages.MediaInformation();
          const metadata = new cast.framework.messages.MusicTrackMediaMetadata();
          metadata.title = meta.title || '';
          metadata.artist = meta.artist || '';
          metadata.albumName = meta.album || meta.albumName || '';
          if (meta.artwork_url) {
            metadata.images = [{ url: meta.artwork_url }];
          }
          mediaInfo.metadata = metadata;
          mediaInfo.contentType = 'audio/raw';
          mediaInfo.streamType = cast.framework.messages.StreamType.LIVE;
          return mediaInfo;
        };

        const pushMediaStatus = (state, meta) => {
          const info = meta ? buildMediaInfo(meta) : null;
          if (info) {
            playerManager.setMediaInformation(info);
            const cmp = document.querySelector('cast-media-player');
            if (cmp) {
              cmp.mediaInfo = info;
            }
          }
          playerManager.setPlayerState(state);
          playerManager.setIdleReason(
            state === cast.framework.messages.PlayerState.IDLE
              ? cast.framework.messages.IdleReason.FINISHED
              : cast.framework.messages.IdleReason.NONE,
          );
          playerManager.broadcastStatus(true);
        };

        const sendJson = (obj) => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify(obj));
          }
        };

        const sendHello = () => {
          const vol = getHardwareVolume();
          sendJson({
            type: 'client/hello',
            payload: {
              client_id: playerId,
              name: playerName,
              version: 1,
              supported_roles: ['player@v1', 'metadata@v1'],
              player_support: {
                supported_formats: [
                  { codec: 'pcm', channels: 2, sample_rate: 48000, bit_depth: 16 },
                  { codec: 'pcm', channels: 2, sample_rate: 44100, bit_depth: 16 },
                ],
                buffer_capacity: 1024 * 1024 * 4,
                supported_commands: ['volume', 'mute'],
              },
            },
          });
          sendState(vol);
        };

        const sendState = (volObj) => {
          const vol = volObj || getHardwareVolume();
          sendJson({
            type: 'client/state',
            payload: {
              player: {
                state: 'synchronized',
                volume: vol.volume,
                muted: vol.muted,
              },
            },
          });
        };

        const decodePcmToBuffer = (arrayBuffer) => {
          if (!streamFormat) return null;
          const { channels = 2, sample_rate = 48000 } = streamFormat;
          const view = new DataView(arrayBuffer);
          const bytesPerSample = 2;
          const frameCount = Math.floor(arrayBuffer.byteLength / (bytesPerSample * channels));
          const ctx = ensureAudioContext();
          const audioBuffer = ctx.createBuffer(channels, frameCount, sample_rate);
          for (let ch = 0; ch < channels; ch++) {
            const channelData = audioBuffer.getChannelData(ch);
            for (let i = 0; i < frameCount; i++) {
              const idx = (i * channels + ch) * bytesPerSample;
              const sample = view.getInt16(idx, true);
              channelData[i] = sample / 32768;
            }
          }
          return audioBuffer;
        };

        const playChunk = (audioBuffer) => {
          if (!audioBuffer) return;
          const ctx = ensureAudioContext();
          if (!playHead) {
            playHead = ctx.currentTime + 0.25;
          }
          const startAt = Math.max(ctx.currentTime + 0.05, playHead);
          const source = ctx.createBufferSource();
          source.buffer = audioBuffer;
          source.connect(ctx.destination);
          source.start(startAt);
          playHead = startAt + audioBuffer.duration;
          pushMediaStatus(cast.framework.messages.PlayerState.PLAYING, lastMetadata);
        };

        const handleServerMessage = (msg) => {
          switch (msg.type) {
            case 'server/hello':
              sendState();
              break;
            case 'server/time':
              sendJson({
                type: 'client/time',
                payload: { client_transmitted: performance.now() * 1000 },
              });
              break;
            case 'stream/start':
              streamFormat = msg.payload?.player || null;
              resetAudio();
              setStatus('Streaming…');
              pushMediaStatus(cast.framework.messages.PlayerState.BUFFERING, lastMetadata);
              break;
            case 'stream/clear':
            case 'stream/end':
              resetAudio();
              setStatus('Idle');
              pushMediaStatus(cast.framework.messages.PlayerState.IDLE, lastMetadata);
              break;
            case 'server/state':
              if (msg.payload?.metadata) {
                lastMetadata = msg.payload.metadata;
                const metaText = [
                  msg.payload.metadata.title,
                  msg.payload.metadata.artist,
                ]
                  .filter(Boolean)
                  .join(' · ');
                if (metaText) setStatus(metaText);
                pushMediaStatus(cast.framework.messages.PlayerState.PAUSED, lastMetadata);
              }
              break;
            case 'server/command':
              if (msg.payload?.player?.command === 'volume') {
                const vol = msg.payload.player.volume ?? null;
                const mute = msg.payload.player.mute ?? null;
                setHardwareVolume(vol, mute);
              }
              break;
            default:
              break;
          }
        };

        const connectWs = (serverUrl, payload) => {
          if (ws) {
            try {
              ws.close();
            } catch {
              /* ignore */
            }
          }
          currentServer = serverUrl;
          playerId = payload.playerId || getStoredPlayerId();
          playerName = payload.playerName || 'Sendspin Cast';
          lastMetadata = payload.metadata || null;
          const syncDelay = typeof payload.syncDelay === 'number' ? payload.syncDelay : 0;

          audioCtx = ensureAudioContext();
          setStatus('Connecting…');
          ws = new WebSocket(serverUrl);
          ws.binaryType = 'arraybuffer';
          ws.onopen = () => {
            setStatus('Connected');
            pushMediaStatus(cast.framework.messages.PlayerState.BUFFERING, lastMetadata);
            sendHello();
            if (syncDelay) {
              sendJson({
                type: 'client/state',
                payload: { player: { sync_delay: syncDelay } },
              });
            }
            if (payload.metadata) {
              handleServerMessage({ type: 'server/state', payload: { metadata: payload.metadata } });
            }
          };
          ws.onmessage = (event) => {
            if (typeof event.data === 'string') {
              try {
                handleServerMessage(JSON.parse(event.data));
              } catch {
                /* ignore */
              }
              return;
            }
            const audioBuffer = decodePcmToBuffer(event.data);
            playChunk(audioBuffer);
          };
          ws.onclose = () => {
            setStatus('Disconnected');
            pushMediaStatus(cast.framework.messages.PlayerState.IDLE, lastMetadata);
            resetAudio();
          };
          ws.onerror = () => {
            setStatus('WebSocket error');
            pushMediaStatus(cast.framework.messages.PlayerState.IDLE, lastMetadata);
          };
        };

        // Cast event listeners
        context.addEventListener(
          cast.framework.system.EventType.SYSTEM_VOLUME_CHANGED,
          () => sendState(),
        );

        context.addEventListener(cast.framework.system.EventType.SENDER_DISCONNECTED, () => {
          setStatus('Disconnected');
        });

        // Intercept volume commands from the Cast control channel
        playerManager.setMessageInterceptor(
          cast.framework.messages.MessageType.SET_VOLUME,
          (data) => {
            if (data) {
              setHardwareVolume(
                typeof data.volume?.level === 'number' ? data.volume.level * 100 : undefined,
                data.volume?.muted,
              );
              sendState();
            }
            return data;
          },
        );

        // Listen for custom messages with serverUrl/playerId/playerName/syncDelay/metadata
        context.addCustomMessageListener(CAST_NS, (event) => {
          const payload = event?.data;
          if (!payload?.serverUrl) return;
          if (currentServer === payload.serverUrl && ws && ws.readyState === WebSocket.OPEN) {
            if (payload.metadata) {
              handleServerMessage({ type: 'server/state', payload: { metadata: payload.metadata } });
            }
            return;
          }
          resetAudio();
          connectWs(payload.serverUrl, payload);
        });

        const options = new cast.framework.CastReceiverOptions();
        options.customNamespaces = {
          [CAST_NS]: cast.framework.system.MessageType.JSON,
        };
        options.disableIdleTimeout = true;
        options.maxInactivity = 3600;
        context.start(options);
        setStatus('Ready');
      })();
    </script>
  </body>
</html>
