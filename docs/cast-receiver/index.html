<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cast Receiver</title>
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  </head>
  <body>
    <cast-media-player></cast-media-player>
    <script>
      (() => {
        'use strict';

        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();
        const customNs = 'urn:x-cast:lox.sendspin';

        const titleEl = document.createElement('div');
        const artistEl = document.createElement('div');
        const albumEl = document.createElement('div');

        const updateOverlay = (meta) => {
          const title = meta?.title || 'Playing...';
          const artist = meta?.artist || '';
          const album = meta?.albumName || meta?.album || '';
          titleEl.textContent = title;
          artistEl.textContent = artist;
          albumEl.textContent = album;
        };

        const applyMetadataToPlayer = (meta) => {
          try {
            const mediaInformation = playerManager.getMediaInformation();
            mediaInformation.metadata = meta;
            playerManager.setMediaInformation(mediaInformation);
          } catch (err) {
            console.warn('updateMetadata error', err);
          }
        };

        // Intercept LOAD to show device name and metadata from customData
        playerManager.setMessageInterceptor(
          cast.framework.messages.MessageType.LOAD,
          (data) => {
            const meta = data?.media?.customData?.metadata;
            const deviceName = data?.media?.customData?.deviceName;
            if (deviceName) {
              badgeEl.textContent = deviceName;
            }
            if (meta) {
              applyMetadataToPlayer(meta);
              updateOverlay(meta);
            }
            return data;
          }
        );

        // Intercept PLAY to refresh metadata if provided
        playerManager.setMessageInterceptor(
          cast.framework.messages.MessageType.PLAY,
          (data) => {
            const meta = data?.customData?.metadata;
            if (meta) {
              applyMetadataToPlayer(meta);
              updateOverlay(meta);
            }
            return data;
          }
        );

        // Custom namespace for live metadata updates without reload
        let sendspin = {
          ws: null,
          heartbeat: null,
          serverUrl: null,
          playerId: null,
          playerName: null,
          audioContext: null,
          audioQueue: [],
          isPlaying: false,
          lastTimestampUs: 0,
          format: { sampleRate: 44100, channels: 2, bitDepth: 16 },
          offsetUs: 0,
          lastClientTimeUs: 0,
        };

        const teardownSendspin = () => {
          sendspin.isPlaying = false;
          sendspin.audioQueue = [];
          sendspin.lastTimestampUs = 0;
          sendspin.offsetUs = 0;
          sendspin.lastClientTimeUs = 0;
          if (sendspin.audioContext) {
            try {
              sendspin.audioContext.close();
            } catch (err) {
              console.warn('AudioContext close error', err);
            }
          }
          sendspin.audioContext = null;
          if (sendspin.heartbeat) {
            clearInterval(sendspin.heartbeat);
            sendspin.heartbeat = null;
          }
          if (sendspin.ws) {
            try {
              sendspin.ws.close();
            } catch (err) {
              console.warn('Sendspin WS close error', err);
            }
          }
          sendspin = {
            ws: null,
            heartbeat: null,
            serverUrl: null,
            playerId: null,
            playerName: null,
            audioContext: null,
            audioQueue: [],
            isPlaying: false,
            lastTimestampUs: 0,
            format: { sampleRate: 44100, channels: 2, bitDepth: 16 },
          };
        };

        const initAudioContext = () => {
          if (sendspin.audioContext) return sendspin.audioContext;
          const ctx = new AudioContext({ sampleRate: sendspin.format.sampleRate });
          sendspin.audioContext = ctx;
          return ctx;
        };

        const schedulePcm = (timestampUs, pcmBuffer) => {
          const ctx = initAudioContext();
          if (!ctx) return;
          const channels = sendspin.format.channels || 2;
          const frameCount = pcmBuffer.byteLength / (2 * channels);
          const audioBuffer = ctx.createBuffer(channels, frameCount, ctx.sampleRate);
          const view = new DataView(pcmBuffer.buffer, pcmBuffer.byteOffset, pcmBuffer.byteLength);
          for (let ch = 0; ch < channels; ch++) {
            const channelData = audioBuffer.getChannelData(ch);
            for (let i = 0; i < frameCount; i++) {
              const sampleIndex = i * channels + ch;
              const sample = view.getInt16(sampleIndex * 2, true) / 32768;
              channelData[i] = sample;
            }
          }
          const now = ctx.currentTime;
          // Translate server ts to local audio clock
          const localSeconds = (timestampUs - sendspin.offsetUs) / 1_000_000;
          const playAt = Math.max(now + 0.02, localSeconds);
          const src = ctx.createBufferSource();
          src.buffer = audioBuffer;
          src.connect(ctx.destination);
          src.start(playAt);
          sendspin.lastTimestampUs = timestampUs;
        };

        const handleAudioChunk = (data) => {
          if (data.byteLength < 9) return;
          const view = new DataView(data);
          const msgType = view.getUint8(0);
          if (msgType !== 4) return; // player audio chunk
          const tsHi = view.getUint32(1);
          const tsLo = view.getUint32(5);
          const timestampUs = tsHi * 0x100000000 + tsLo;
          const pcm = new Uint8Array(data, 9);
          schedulePcm(timestampUs, pcm);
        };

        const sendSendspin = (obj) => {
          if (sendspin.ws && sendspin.ws.readyState === WebSocket.OPEN) {
            sendspin.ws.send(JSON.stringify(obj));
          }
        };

        const startSendspin = (payload) => {
          const { serverUrl, playerId, playerName } = payload;
          if (!serverUrl || !playerId) return;
          teardownSendspin();
          sendspin.serverUrl = serverUrl;
          sendspin.playerId = playerId;
          sendspin.playerName = playerName || 'Sendspin Cast';
          try {
            const ws = new WebSocket(serverUrl);
            sendspin.ws = ws;
            ws.onopen = () => {
              const hello = {
                type: 'client/hello',
                payload: {
                  client_id: playerId,
                  name: playerName || 'Sendspin Cast',
                  version: 1,
                  supported_roles: ['player@v1', 'metadata@v1'],
                  player_support: {
                    supported_formats: [
                      {
                        codec: 'pcm',
                        channels: 2,
                        sample_rate: 44100,
                        bit_depth: 16,
                      },
                    ],
                    buffer_capacity: 1024 * 1024 * 4,
                    supported_commands: [],
                  },
                },
              };
              sendSendspin(hello);
              // clock sync
            sendspin.heartbeat = setInterval(() => {
              sendspin.lastClientTimeUs = Date.now() * 1000;
              sendSendspin({
                type: 'client/time',
                payload: { client_transmitted: sendspin.lastClientTimeUs },
              });
            }, 5000);
          };
          ws.onmessage = (ev) => {
            if (typeof ev.data === 'string') {
                try {
                  const msg = JSON.parse(ev.data);
                  handleSendspinMessage(msg);
                } catch (err) {
                  console.warn('Sendspin JSON parse error', err);
                }
              } else {
                const buf = ev.data instanceof ArrayBuffer ? ev.data : ev.data.buffer;
                handleAudioChunk(new Uint8Array(buf));
              }
            };
            ws.onclose = () => teardownSendspin();
            ws.onerror = () => teardownSendspin();
          } catch (err) {
            console.warn('Sendspin connect error', err);
            teardownSendspin();
          }
        };

        const handleSendspinMessage = (msg) => {
          if (!msg || !msg.type) return;
          switch (msg.type) {
            case 'server/hello': {
              // immediately report we are synchronized to allow metadata flow
              sendSendspin({
                type: 'client/state',
                payload: { player: { state: 'synchronized' } },
              });
              break;
            }
            case 'server/time': {
              const clientTx = msg.payload?.client_transmitted;
              const serverRx = msg.payload?.server_received;
              const serverTx = msg.payload?.server_transmitted;
              if (typeof clientTx === 'number' && typeof serverRx === 'number' && typeof serverTx === 'number') {
                // Simple NTP offset estimate
                const offset = ((serverRx + serverTx) / 2) - clientTx;
                sendspin.offsetUs = offset;
              }
              break;
            }
            case 'server/state': {
              const metadata = msg.payload?.metadata;
              if (metadata) {
                applyMetadataToPlayer(metadata);
                updateOverlay(metadata);
              }
              break;
            }
            default:
              break;
          }
        };

        context.addCustomMessageListener(customNs, (event) => {
          const payload = event?.data;
          if (!payload) return;
          if (payload.metadata) {
            applyMetadataToPlayer(payload.metadata);
            updateOverlay(payload.metadata);
          }
          if (payload.serverUrl && payload.playerId) {
            // Use pure Sendspin path (audio over WS).
            startSendspin(payload);
          }
        });

        context.start();
      })();
    </script>
  </body>
</html>
