<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cast Receiver</title>
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  </head>
  <body>
    <cast-media-player></cast-media-player>
    <script>
      (() => {
        'use strict';

        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();
        const customNs = 'urn:x-cast:sendspin';
        const statusEl = document.createElement('div');
        statusEl.style.position = 'fixed';
        statusEl.style.bottom = '12px';
        statusEl.style.left = '12px';
        statusEl.style.fontSize = '14px';
        statusEl.style.opacity = '0.6';
        statusEl.textContent = 'Waiting for sender...';
        document.body.appendChild(statusEl);

        const setStatus = (text) => {
          statusEl.textContent = text;
          context.setApplicationState?.(text);
        };

        const setPlayerState = (state) => {
          try {
            playerManager.setMediaPlaybackState?.(state);
          } catch {
            /* ignore */
          }
        };

        const updateOverlay = (meta) => {
          const castPlayer = document.querySelector('cast-media-player');
          if (!castPlayer) return;
          const mediaInfo = playerManager.getMediaInformation();
          mediaInfo.metadata = {
            metadataType: 3,
            title: meta?.title || '',
            artist: meta?.artist || '',
            albumName: meta?.album || meta?.albumName || '',
            images: meta?.artwork_url ? [{ url: meta.artwork_url }] : undefined,
          };
          playerManager.setMediaInformation(mediaInfo);
          if (meta?.title) castPlayer.mediaInfo = mediaInfo;
        };

        playerManager.setMessageInterceptor(
          cast.framework.messages.MessageType.LOAD,
          (data) => data,
        );

        // --- Minimal Sendspin client (PCM only) --------------------------------
        let ws = null;
        let currentServer = null;
        let playerId = null;
        let playerName = 'Sendspin Cast';
        let audioCtx = null;
        let streamFormat = null;
        let playHead = 0;

        const resetAudio = () => {
          playHead = 0;
          streamFormat = null;
        };

        const getHardwareVolume = () => {
          const systemVolume = context.getSystemVolume?.();
          if (!systemVolume) return { volume: 100, muted: false };
          return {
            volume: Math.round((systemVolume.level || 0) * 100),
            muted: Boolean(systemVolume.muted),
          };
        };

        const setHardwareVolume = (volume, muted) => {
          try {
            if (typeof volume === 'number') {
              context.setSystemVolumeLevel?.(Math.max(0, Math.min(1, volume / 100)));
            }
            if (typeof muted === 'boolean') {
              context.setSystemVolumeMuted?.(muted);
            }
          } catch (err) {
            console.warn('Set HW volume failed', err);
          }
        };

        const sendJson = (obj) => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify(obj));
          }
        };

        const handleServerMessage = (msg) => {
          switch (msg.type) {
            case 'server/hello':
              sendState();
              break;
            case 'server/time':
              // Acknowledge by echoing client/time with now
              sendJson({ type: 'client/time', payload: { client_transmitted: performance.now() * 1000 } });
              break;
            case 'stream/start':
              streamFormat = msg.payload?.player || null;
              resetAudio();
              setStatus('Streaming…');
              setPlayerState(cast.framework.messages.PlayerState.PLAYING);
              break;
            case 'stream/clear':
            case 'stream/end':
              resetAudio();
              setStatus('Idle');
              setPlayerState(cast.framework.messages.PlayerState.IDLE);
              break;
            case 'server/command':
              if (msg.payload?.player?.command === 'volume') {
                const vol = msg.payload.player.volume ?? null;
                const mute = msg.payload.player.mute ?? null;
                setHardwareVolume(vol, mute);
              }
              break;
            default:
              break;
          }
        };

        const sendHello = () => {
          const vol = getHardwareVolume();
          sendJson({
            type: 'client/hello',
            payload: {
              client_id: playerId,
              name: playerName,
              version: 1,
              supported_roles: ['player@v1', 'metadata@v1'],
              player_support: {
                supported_formats: [
                  { codec: 'pcm', channels: 2, sample_rate: 48000, bit_depth: 16 },
                  { codec: 'pcm', channels: 2, sample_rate: 44100, bit_depth: 16 },
                ],
                buffer_capacity: 1024 * 1024 * 4,
                supported_commands: ['volume', 'mute'],
              },
            },
          });
          sendState(vol);
        };

        const sendState = (volObj) => {
          const vol = volObj || getHardwareVolume();
          sendJson({
            type: 'client/state',
            payload: {
              player: {
                state: 'synchronized',
                volume: vol.volume,
                muted: vol.muted,
              },
            },
          });
        };

        const decodePcmToBuffer = (arrayBuffer) => {
          if (!streamFormat) return null;
          const { channels = 2, sample_rate = 48000 } = streamFormat;
          const view = new DataView(arrayBuffer);
          const bytesPerSample = 2;
          const frameCount = Math.floor(arrayBuffer.byteLength / (bytesPerSample * channels));
          const audioBuffer = audioCtx.createBuffer(channels, frameCount, sample_rate);
          for (let ch = 0; ch < channels; ch++) {
            const channelData = audioBuffer.getChannelData(ch);
            for (let i = 0; i < frameCount; i++) {
              const idx = (i * channels + ch) * bytesPerSample;
              const sample = view.getInt16(idx, true);
              channelData[i] = sample / 32768;
            }
          }
          return audioBuffer;
        };

        const playChunk = (audioBuffer) => {
          if (!audioBuffer) return;
          if (!playHead) {
            playHead = audioCtx.currentTime + 0.2;
          }
          const startAt = Math.max(audioCtx.currentTime + 0.05, playHead);
          const source = audioCtx.createBufferSource();
          source.buffer = audioBuffer;
          source.connect(audioCtx.destination);
          source.start(startAt);
          playHead = startAt + audioBuffer.duration;
        };

        const connectWs = (serverUrl, payload) => {
          if (ws) {
            try {
              ws.close();
            } catch {
              /* ignore */
            }
          }
          currentServer = serverUrl;
          playerId = payload.playerId || `cast-${Math.random().toString(36).slice(2, 8)}`;
          playerName = payload.playerName || 'Sendspin Cast';
          audioCtx = audioCtx || new AudioContext();
          ws = new WebSocket(serverUrl);
          ws.binaryType = 'arraybuffer';
          ws.onopen = () => {
            setStatus('Connected');
            sendHello();
            if (payload.metadata) updateOverlay(payload.metadata);
          };
          ws.onmessage = (event) => {
            if (typeof event.data === 'string') {
              try {
                handleServerMessage(JSON.parse(event.data));
              } catch {
                /* ignore */
              }
              return;
            }
            const audioBuffer = decodePcmToBuffer(event.data);
            playChunk(audioBuffer);
          };
          ws.onclose = () => {
            setStatus('Disconnected');
            resetAudio();
          };
          ws.onerror = () => {
            setStatus('WebSocket error');
          };
        };

        context.addCustomMessageListener(customNs, (event) => {
          const payload = event?.data;
          if (!payload?.serverUrl) return;
          // Ignore duplicate connects to the same server
          if (currentServer === payload.serverUrl && ws && ws.readyState === WebSocket.OPEN) {
            if (payload.metadata) updateOverlay(payload.metadata);
            return;
          }
          resetAudio();
          connectWs(payload.serverUrl, payload);
        });

        const options = new cast.framework.CastReceiverOptions();
        options.customNamespaces = {
          [customNs]: cast.framework.system.MessageType.JSON,
        };
        options.disableIdleTimeout = true;
        context.start(options);
      })();
    </script>
  </body>
</html>
